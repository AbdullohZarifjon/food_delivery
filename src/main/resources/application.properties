# --- ILOVA NOMI ---
spring.application.name=food

server.port=8080

# --- DATABASE (POSTGRESQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/food
spring.datasource.username=postgres
spring.datasource.password=1997
spring.datasource.driverClassName=org.postgresql.Driver


# --- JPA / HIBERNATE SOZLAMALARI ---
# ddl-auto=update faqat test uchun yaxshi. Real loyihada buni 'validate' yoki 'none' qilish kerak.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL so'rovlarini konsolda ko'rish (Development uchun foydali, lekin Productionda o'chirish kerak)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Statistikani o'chirib tashlaymiz. Bu server resursini yeydi va faqat debug uchun kerak.
# OLIB TASHLANDI: generate_statistics va logging.level.org.hibernate.stat

# Batching (Guruhli amallar) - Bu bazaga yuklamani kamaytiradi, albatta yoqish kerak
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=30

# --- JAVA 21 VIRTUAL THREADS ---
# SSE va WebSocket bilan ishlashda threadlar tugab qolmasligi uchun eng muhim sozlama!
spring.threads.virtual.enabled=true

# --- JACKSON (JSON) SOZLAMALARI ---
# JTS Point/Polygon turlarini JSON-ga o'tkazishda xato bermasligi uchun kerak
spring.jackson.serialization.fail-on-empty-beans=false

# --- SECURITY & JWT ---
# JWT muddati va maxfiy kalitlari
jwt.access.token.expire.date=86400000
jwt.access.token.secretKey=JudaUzunVaMaxfiyAccessKalit1234567890!@#$StrongKey

jwt.refresh.token.expire.date=2592000000
jwt.refresh.token.secretKey=YanaHamUzunroqVaBoshqachaRefreshKalit98765!@#$EvenStrongerKey

# --- PAGINATION (SAHIFALASH) ---
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.one-indexed-parameters=false

# --- STORAGE (MINIO) ---
minio.url=http://127.0.0.1:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=food-delivery-bucket

# --- CACHE / SESSION (REDIS) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- FILE UPLOAD (MULTIPART) ---
# Ovqat rasmlari uchun 10MB juda yetarli. 500MB serverni to'ldirib yuborishi mumkin edi.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- MIGRATION (FLYWAY) ---
# Agar Flyway ishlatmayotgan bo'lsangiz, false turgani ma'qul, aks holda ilova o'chib qoladi.
spring.flyway.enabled=false

# 1. Agarda URL topilmasa, xato (Exception) otishni yoqish
spring.mvc.throw-exception-if-no-handler-found=true

# 2. Resurslarni (static files) qidirishni cheklash (404 chiqishi uchun shart)
spring.web.resources.add-mappings=false

# 3. Path matching strategiyasini aniqlashtirish (AntPathMatcher xatolarni yaxshi tutadi)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

